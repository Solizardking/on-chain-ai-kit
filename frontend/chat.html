<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenClawd Kit · Stream Chat</title>
  <style>
    :root {
      --bg: #0a0c10; --surface: #13161c; --border: #2a3040;
      --text: #e4e8f0; --muted: #8892a6; --accent: #14f195; --warn: #f0b90b; --err: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
      background: var(--surface); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
    }
    header h1 { font-size: 1rem; font-weight: 700; }
    header a { color: var(--accent); font-size: 0.8rem; text-decoration: none; }
    main { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; padding: 1rem; gap: 0.75rem; }
    #log {
      flex: 1; min-height: 320px; overflow: auto; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; padding: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; line-height: 1.45;
    }
    .msg { margin-bottom: 0.75rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user { color: var(--accent); }
    .msg.assistant { color: var(--text); }
    .msg.tool { color: var(--warn); }
    .msg.error { color: var(--err); }
    .msg.meta { color: var(--muted); font-size: 0.75rem; }
    .composer { display: flex; gap: 0.5rem; }
    .composer textarea { flex: 1; min-height: 64px; resize: vertical;
      font: inherit; border-radius: 8px; border: 1px solid var(--border);
      background: #1a1f2b; color: var(--text); padding: 0.5rem 0.75rem; }
    button {
      font: inherit; border-radius: 8px; border: none; padding: 0.5rem 0.75rem;
      background: var(--accent); color: #04120c; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .status { font-size: 0.8rem; color: var(--muted); }
    .status.ok { color: var(--accent); }
    .status.bad { color: var(--err); }
    .banner {
      font-size: 0.8rem; padding: 0.6rem 0.75rem; border-radius: 8px;
      background: rgba(20,241,149,0.08); border: 1px solid rgba(20,241,149,0.25);
    }
  </style>
</head>
<body>
  <header>
    <h1>🦞 Stream chat</h1>
    <a href="/">Agent Studio</a>
    <button type="button" class="secondary" id="pingBtn">healthz</button>
  </header>

  <main>
    <p class="status" id="status">Checking server…</p>
    <div class="banner" id="banner">Local mode: no login. Kit signs with <code>SOLANA_PRIVATE_KEY</code>.</div>

    <div class="composer">
      <textarea id="prompt" placeholder="e.g. what is my public key?"></textarea>
      <div style="display:flex;flex-direction:column;gap:0.5rem;">
        <button type="button" id="sendBtn">Send /stream</button>
        <button type="button" class="secondary" id="authBtn">GET /auth</button>
      </div>
    </div>

    <div id="log"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const logEl = $("log");
    let authMode = "local";

    function append(cls, text) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function ping() {
      try {
        const r = await fetch("/healthz");
        const j = await r.json();
        authMode = j.auth_mode || "local";
        $("status").textContent = `kit OK · mode=${authMode}` +
          (j.local_pubkey ? ` · ${j.local_pubkey.slice(0, 8)}…` : "") +
          ` · ${j.timestamp || ""}`;
        $("status").className = "status ok";
        $("banner").textContent = authMode === "local"
          ? "Local mode: no Privy / no Bearer token. Dev only — do not expose publicly."
          : "Privy mode: this page still works without a token only for healthz; /stream needs JWT (use a Privy client).";
      } catch (e) {
        $("status").textContent = `kit unreachable: ${e.message}`;
        $("status").className = "status bad";
      }
    }

    async function checkAuth() {
      append("meta", "GET /auth …");
      const r = await fetch("/auth");
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        append("error", `auth ${r.status}: ${JSON.stringify(j)}`);
        return;
      }
      append("meta", `auth ok · ${j.auth_mode} · wallet ${j.wallet_address || "?"}`);
    }

    async function sendStream() {
      const prompt = $("prompt").value.trim();
      if (!prompt) {
        append("error", "Empty prompt");
        return;
      }
      $("sendBtn").disabled = true;
      append("user", "you: " + prompt);
      append("meta", "POST /stream …");

      try {
        const headers = {
          "Content-Type": "application/json",
          Accept: "text/event-stream",
        };
        // Local mode: no Authorization. Privy mode: set window.__PRIVY_TOKEN if needed.
        if (window.__PRIVY_TOKEN) {
          headers.Authorization = `Bearer ${window.__PRIVY_TOKEN}`;
        }

        const res = await fetch("/stream", {
          method: "POST",
          headers,
          body: JSON.stringify({
            prompt,
            chat_history: [],
            chain: "solana",
          }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        let assistant = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop() || "";
          for (const frame of parts) {
            const dataLine = frame.split("\n").find((l) => l.startsWith("data:"));
            if (!dataLine) continue;
            const raw = dataLine.replace(/^data:\s?/, "");
            let ev;
            try { ev = JSON.parse(raw); } catch { append("meta", raw); continue; }

            if (ev.type === "Message") {
              const chunk = typeof ev.content === "string" ? ev.content : JSON.stringify(ev.content);
              assistant += chunk;
              const last = logEl.lastElementChild;
              if (last && last.dataset.role === "assistant") {
                last.textContent = "agent: " + assistant;
              } else {
                const d = document.createElement("div");
                d.className = "msg assistant";
                d.dataset.role = "assistant";
                d.textContent = "agent: " + assistant;
                logEl.appendChild(d);
              }
              logEl.scrollTop = logEl.scrollHeight;
            } else if (ev.type === "ToolCall") {
              const c = ev.content || {};
              append("tool", `tool ${c.name || "?"}: ${c.result || JSON.stringify(c)}`);
            } else if (ev.type === "Error") {
              append("error", String(ev.content || ev));
            } else {
              append("meta", JSON.stringify(ev));
            }
          }
        }
        append("meta", "stream end");
      } catch (e) {
        append("error", e.message || String(e));
      } finally {
        $("sendBtn").disabled = false;
      }
    }

    $("pingBtn").onclick = ping;
    $("authBtn").onclick = checkAuth;
    $("sendBtn").onclick = sendStream;
    $("prompt").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendStream();
    });
    ping();
  </script>
</body>
</html>
