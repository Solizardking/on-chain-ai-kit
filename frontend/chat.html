<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenClawd Kit · Stream Chat</title>
  <style>
    :root {
      --bg: #0a0c10; --surface: #13161c; --border: #2a3040;
      --text: #e4e8f0; --muted: #8892a6; --accent: #14f195; --warn: #f0b90b; --err: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
      background: var(--surface); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
    }
    header h1 { font-size: 1rem; font-weight: 700; }
    header a { color: var(--accent); font-size: 0.8rem; text-decoration: none; }
    main { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; padding: 1rem; gap: 0.75rem; }
    #log {
      flex: 1; min-height: 320px; overflow: auto; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; padding: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; line-height: 1.45;
    }
    .msg { margin-bottom: 0.75rem; white-space: pre-wrap; word-break: break-word; }
    .msg.user { color: var(--accent); }
    .msg.assistant { color: var(--text); }
    .msg.tool { color: var(--warn); }
    .msg.error { color: var(--err); }
    .msg.meta { color: var(--muted); font-size: 0.75rem; }
    .composer { display: flex; gap: 0.5rem; }
    .composer textarea {
      flex: 1; min-height: 64px; resize: vertical;
      font: inherit; border-radius: 8px; border: 1px solid var(--border);
      background: #1a1f2b; color: var(--text); padding: 0.5rem 0.75rem;
    }
    button {
      font: inherit; border-radius: 8px; border: none; padding: 0.5rem 0.75rem;
      background: var(--accent); color: #04120c; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .status { font-size: 0.8rem; color: var(--muted); }
    .status.ok { color: var(--accent); }
    .status.bad { color: var(--err); }
    .banner {
      font-size: 0.8rem; padding: 0.6rem 0.75rem; border-radius: 8px;
      background: rgba(20,241,149,0.08); border: 1px solid rgba(20,241,149,0.25);
    }
    .banner.warn {
      background: rgba(240,185,11,0.08); border-color: rgba(240,185,11,0.35); color: var(--warn);
    }
    input.api {
      font: inherit; font-size: 0.75rem; border-radius: 8px; border: 1px solid var(--border);
      background: #1a1f2b; color: var(--muted); padding: 0.4rem 0.6rem; min-width: 220px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🦞 Stream chat</h1>
    <a href="/">Agent Studio</a>
    <input class="api" id="apiBase" title="API base URL" placeholder="http://127.0.0.1:6969" />
    <button type="button" class="secondary" id="pingBtn">healthz</button>
  </header>

  <main>
    <p class="status" id="status">Checking server…</p>
    <div class="banner" id="banner">Connecting to kit…</div>

    <div class="composer">
      <textarea id="prompt" placeholder="e.g. what is my public key?  (⌘/Ctrl+Enter to send)"></textarea>
      <div style="display:flex;flex-direction:column;gap:0.5rem;">
        <button type="button" id="sendBtn">Send /stream</button>
        <button type="button" class="secondary" id="authBtn">GET /auth</button>
        <button type="button" class="secondary" id="clearBtn">Clear</button>
      </div>
    </div>

    <div id="log"></div>
  </main>

  <script>
    /**
     * Resolve kit API origin.
     * - Same-origin when served by kit (http://localhost:6969/chat.html)
     * - Override via ?api= or localStorage or the input field
     * - file:// fallback → http://127.0.0.1:6969
     */
    function defaultApiBase() {
      const q = new URLSearchParams(location.search).get("api");
      if (q) return q.replace(/\/$/, "");
      const stored = localStorage.getItem("kit_api_base");
      if (stored) return stored.replace(/\/$/, "");
      if (location.protocol === "file:" || !location.host) return "http://127.0.0.1:6969";
      // If opened on a non-kit port (e.g. live-server), still point at kit.
      if (location.port && location.port !== "6969") return "http://127.0.0.1:6969";
      return ""; // same origin
    }

    const $ = (id) => document.getElementById(id);
    const logEl = $("log");
    let authMode = "local";

    function apiBase() {
      return ($("apiBase").value || "").trim().replace(/\/$/, "");
    }

    function url(path) {
      const b = apiBase();
      return b ? b + path : path;
    }

    function append(cls, text) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
      return d;
    }

    function handleSsePayload(raw, state) {
      if (!raw || raw === "[DONE]") return;
      let ev;
      try {
        ev = JSON.parse(raw);
      } catch {
        // ignore keep-alive / retry lines that leaked through
        if (raw.startsWith(":") || raw.startsWith("retry:")) return;
        append("meta", raw);
        return;
      }

      if (ev.type === "Message") {
        const chunk = typeof ev.content === "string" ? ev.content : JSON.stringify(ev.content);
        state.assistant += chunk;
        if (state.assistantEl) {
          state.assistantEl.textContent = "agent: " + state.assistant;
        } else {
          state.assistantEl = append("assistant", "agent: " + state.assistant);
          state.assistantEl.dataset.role = "assistant";
        }
        logEl.scrollTop = logEl.scrollHeight;
      } else if (ev.type === "ToolCall") {
        const c = ev.content || {};
        append("tool", `tool ${c.name || "?"}: ${c.result || JSON.stringify(c)}`);
        state.assistant = "";
        state.assistantEl = null;
      } else if (ev.type === "Error") {
        append("error", String(ev.content ?? JSON.stringify(ev)));
        state.assistant = "";
        state.assistantEl = null;
      } else {
        append("meta", JSON.stringify(ev));
      }
    }

    function drainSseBuffer(buf, state) {
      const parts = buf.split("\n\n");
      const rest = parts.pop() || "";
      for (const frame of parts) {
        const dataLine = frame
          .split("\n")
          .map((l) => l.trimEnd())
          .find((l) => l.startsWith("data:"));
        if (!dataLine) continue;
        handleSsePayload(dataLine.replace(/^data:\s?/, ""), state);
      }
      // trailing frame without blank line
      if (rest.trim()) {
        const dataLine = rest
          .split("\n")
          .map((l) => l.trimEnd())
          .find((l) => l.startsWith("data:"));
        if (dataLine) handleSsePayload(dataLine.replace(/^data:\s?/, ""), state);
      }
    }

    async function ping() {
      try {
        const r = await fetch(url("/healthz"), { cache: "no-store" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const j = await r.json();
        authMode = j.auth_mode || "local";
        const mesh = j.mesh_base_url || "";
        const model = j.mesh_model || "";
        $("status").textContent =
          `kit OK · mode=${authMode}` +
          (j.local_pubkey ? ` · ${String(j.local_pubkey).slice(0, 8)}…` : "") +
          (model ? ` · model=${model}` : "") +
          (j.timestamp ? ` · ${j.timestamp}` : "");
        $("status").className = "status ok";
        $("banner").className = "banner";
        $("banner").textContent =
          (authMode === "local"
            ? "Local mode: no Privy. Kit signs with SOLANA_PRIVATE_KEY (dev only). "
            : "Privy mode: set window.__PRIVY_TOKEN for /stream. ") +
          (mesh ? `LLM mesh: ${mesh}` : "");
        localStorage.setItem("kit_api_base", apiBase());
      } catch (e) {
        $("status").textContent = `kit unreachable: ${e.message}`;
        $("status").className = "status bad";
        $("banner").className = "banner warn";
        $("banner").textContent =
          "Start the kit from the repo root:  cargo run --features full --bin kit   · then open http://127.0.0.1:6969/chat.html";
      }
    }

    async function checkAuth() {
      append("meta", "GET /auth …");
      try {
        const r = await fetch(url("/auth"), { cache: "no-store" });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          append("error", `auth ${r.status}: ${JSON.stringify(j)}`);
          return;
        }
        append("meta", `auth ok · ${j.auth_mode} · wallet ${j.wallet_address || "?"}`);
      } catch (e) {
        append("error", e.message || String(e));
      }
    }

    async function sendStream() {
      const prompt = $("prompt").value.trim();
      if (!prompt) {
        append("error", "Empty prompt");
        return;
      }
      $("sendBtn").disabled = true;
      append("user", "you: " + prompt);
      append("meta", `POST ${url("/stream")} …`);

      const state = { assistant: "", assistantEl: null };

      try {
        const headers = {
          "Content-Type": "application/json",
          Accept: "text/event-stream",
        };
        if (window.__PRIVY_TOKEN) {
          headers.Authorization = `Bearer ${window.__PRIVY_TOKEN}`;
        }

        const res = await fetch(url("/stream"), {
          method: "POST",
          headers,
          body: JSON.stringify({
            prompt,
            chat_history: [],
            chain: "solana",
          }),
        });

        if (!res.ok && !res.body) {
          append("error", `HTTP ${res.status}`);
          return;
        }
        if (!res.body) {
          const t = await res.text();
          append("error", t || `HTTP ${res.status} (no body)`);
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop() || "";
          for (const frame of parts) {
            const dataLine = frame
              .split("\n")
              .map((l) => l.trimEnd())
              .find((l) => l.startsWith("data:"));
            if (!dataLine) continue;
            handleSsePayload(dataLine.replace(/^data:\s?/, ""), state);
          }
        }
        // flush decoder + remainder
        buf += decoder.decode();
        drainSseBuffer(buf, state);
        append("meta", "stream end");
      } catch (e) {
        append("error", e.message || String(e));
      } finally {
        $("sendBtn").disabled = false;
      }
    }

    $("apiBase").value = defaultApiBase();
    $("apiBase").addEventListener("change", () => {
      localStorage.setItem("kit_api_base", apiBase());
      ping();
    });
    $("pingBtn").onclick = ping;
    $("authBtn").onclick = checkAuth;
    $("sendBtn").onclick = sendStream;
    $("clearBtn").onclick = () => { logEl.innerHTML = ""; };
    $("prompt").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        sendStream();
      }
    });
    ping();
  </script>
</body>
</html>
