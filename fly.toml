# OpenClawd Solana Kit — Fly.io one-shot Agent Studio
#   fly apps create openclawd-solana-kit   # once
#   fly secrets set SOLANA_PRIVATE_KEY=... # required (local auth)
#   fly secrets set XAI_API_KEY=...        # optional Grok 4.5
#   fly deploy
#
# Public URL: https://openclawd-solana-kit.fly.dev/

app = "openclawd-solana-kit"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  KIT_AUTH_MODE = "local"
  CLAWD_FRONTEND_DIR = "/app/frontend"
  RUST_LOG = "info"
  SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
  # LLM defaults to Clawd mesh when XAI_API_KEY not set as a secret
  CLAWD_MESH_BASE_URL = "https://clawd-inference-mesh.fly.dev/v1"
  CLAWD_MESH_MODEL = "zkrouter/auto"

[http_service]
  internal_port = 6969
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
